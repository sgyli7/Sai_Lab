[project]
name = "microduck-sim2sim"
version = "0.1.0"
description = "MuJoCo ↔ Godot/Jolt Sim2Sim toolchain (robot-agnostic; Microduck first)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.10.0",
    "onnxruntime>=1.20",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
sai = ["sai-agent-001 @ git+https://github.com/sgyli7/Sai_Agent_001.git@5d2ab070dcdbae61a8d750a3f812e77ad2568f26"]
media = ["av>=18.1,<19", "pillow>=12.2,<13"]
# Direct torch pin so [tool.uv.sources] can bind the CUDA index on aarch64
# (uv applies sources to DIRECT dependencies only).
train = [
    "torch==2.9.1",
    "rsl-rl-lib==5.0.1",
    "tensorboard",
    "pyyaml",
    "onnx>=1.20",
]

[project.scripts]
mjcf2godot = "mjcf2godot.convert:main"
sim2sim-runner = "sim2sim.runner:main"
sim2sim-calib = "sim2sim.calib:main"
sim2sim-compare = "sim2sim.compare:main"
sim2sim-spikes = "sim2sim.spikes:main"
sim2sim-play = "sim2sim.play:main"
sim2sim-kick-gate = "sim2sim.kick_gate:main"
sim2sim-onnx-import = "sim2sim.train.onnx_import:main"
sim2sim-export = "sim2sim.train.export:main"
sim2sim-eval-walk = "sim2sim.train.eval_walk:main"
sim2sim-eval-skill = "sim2sim.train.eval_skill:main"
sim2sim-bench-godot = "sim2sim.train.bench:main"
sim2sim-train = "sim2sim.train.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src layout. The editable install must be a .pth pointing at src/, NOT a copy
# under site-packages: the previous `force-include` blocks copied the sources,
# so `uv run` executed a stale snapshot instead of the working tree.
[tool.hatch.build.targets.wheel]
packages = ["src/sim2sim", "src/mjcf2godot"]
# This frozen runtime policy is required even though generated ONNX files are
# normally ignored. Keep editable Python modules pointed at the source tree.
artifacts = [
    "src/sim2sim/assets/sai/flat-motion-v1.onnx",
    "src/sim2sim/assets/sai/upstream/**/*.onnx",
    "src/sim2sim/assets/sai/upstream/**/*.json",
]

[tool.uv]
package = true

[tool.uv.sources]
# On linux-aarch64 (DGX Spark / GB10) PyPI's torch wheel is CPU-ONLY.
# Route torch to PyTorch's CUDA index there. Copy of the mjlab-microduck pin:
# uv applies sources to DIRECT dependencies only, so torch is listed in the
# `train` extra (not merely pulled in by rsl-rl-lib).
torch = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.hatch.metadata]
allow-direct-references = true
