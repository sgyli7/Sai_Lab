# Godot/Jolt walk finetune env + PPO hyperparameters.
# Phase 2 owns env/reward/command/faults. Phase 3 fills the runner around `ppo:`.

robot: ${SIM2SIM_ROOT}/robots/microduck.json
num_envs: 8
episode_s: 20
headless: true
seed: 0
device: cpu
recv_timeout_s: 10.0
spawn_stagger_s: 0.05
max_faults_per_step: 8
faults_jsonl: ${SIM2SIM_ROOT}/results/faults.jsonl
init_onnx: ${MICRODUCK_POLICIES}/alpha_walking.onnx

reset:
  yaw_range: [-3.141592653589793, 3.141592653589793]
  joint_noise_rad: 0.05

obs_noise:
  enabled: true
  kind: uniform
  gyro: 0.03
  grav: 0.01
  q: 0.001
  qd: 0.25

commands:
  mode: twist
  resample_s: [3.0, 8.0]
  vx: [-0.4, 0.4]
  vy: [-0.3, 0.3]
  wz: [-1.0, 1.0]
  standing_frac: 0.02
  turn_in_place_frac: 0.15
  turn_wz: [0.4, 1.0]

# Iteration-linear curriculum. Each term: [start, end, start_iter, end_iter].
# Source: microduck_rl microduck_velocity_env_cfg.py
#   standing_envs: 0.02 → 0.25 by iter 2000 (step-staged * 24)
#   action_rate_l2: -0.1 → -1.0 by iter 1500 (stage-0 weight -0.1)
#   head_pose_bias: 0 until iter 600, then +1 → +3 by iter 1500
#     (mjlab weight is positive; the penalty func returns negative. Ours stores
#     the signed reward weight, so 0 → -3.)
#   air_time / foot_slip / body_ang_vel / dof_pos_limits are NOT curriculum-driven.
# Tracking kernel is exp(-err² / std²) with std=sqrt(0.1) → std²=0.1 (already).
# Scaled so finals land at iter 1000 of a 3000-iter Godot fine-tune (alpha already walks).
curriculum:
  standing_frac: [0.02, 0.25, 0, 1000]
  action_rate_l2: [-0.1, -1.0, 0, 1000]
  head_pose_bias: [0.0, -3.0, 300, 1000]

pushes:
  enabled: true
  interval_s: [3.0, 6.0]
  xy_speed: 0.3

rewards:
  track_lin_vel: 2.0
  track_lin_vel_std2: 0.1
  track_ang_vel: 2.0
  track_ang_vel_std2: 0.5
  upright: 2.0
  upright_std2: 0.05
  air_time: 3.0
  air_time_min: 0.125
  air_time_max: 0.3
  air_time_cmd_threshold: 0.01
  # mjlab feet_air_time: +1/foot/step while current air time ∈ (tmin, tmax), not on touchdown.
  pose_legs: 1.0
  pose_walking_threshold: 0.01
  foot_clearance: -2.0
  foot_clearance_target: 0.02
  foot_swing_height: -0.25
  foot_swing_target: 0.02
  # Stage-0 microduck_rl value; curriculum ramps to -1.0 by iter 1000.
  action_rate_l2: -0.1
  foot_slip: -0.1
  body_ang_vel: -0.05
  head_pose_tracking: 2.0
  head_pose_tracking_std: 0.5
  # microduck_rl starts at 0 (penalty func is negative); curriculum ramps to -3.
  head_pose_bias: 0.0
  head_pose_bias_tau_s: 1.0
  dof_pos_limits: -1.0
  scale_by_dt: true
  # angular_momentum skipped: Godot lite step has no whole-body angmom sensor.

termination:
  tilt_deg: 70.0
  min_z: 0.055

ppo:
  learning_rate: 3.0e-4
  schedule: adaptive
  # 0.01 drove the adaptive schedule to the 1e-5 floor right after unfreezing (probe60).
  desired_kl: 0.015
  entropy_coef: 0.001
  clip_param: 0.2
  gamma: 0.99
  lam: 0.95
  num_learning_epochs: 5
  num_mini_batches: 4
  # local_ppo model_2999.pt ended with per-joint std 0.15-0.23; start inside that band.
  init_std: 0.18
  critic_warmup_iters: 100
  # First unfrozen PPO step: Adam actor moments are empty after critic warmup, so
  # a 3e-4 update is ≈lr·sign(g) and KL spikes (~1.6) → adaptive floors at 1e-5.
  unfreeze_learning_rate: 3.0e-5
  hidden_dims: [512, 256, 128]
  activation: elu
  obs_normalization: true
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  normalize_advantage_per_mini_batch: false
  optimizer: adam
  samples_per_iter: 2048
  save_interval: 50

train:
  samples_per_iter: 2048
  save_interval: 50
  max_iterations: 3000
  log_root: logs/walk_godot
  run_name: walk
