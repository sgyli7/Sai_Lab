# Godot/Jolt ground pick. Play cmd = [cos 2πφ, sin 2πφ, 0], period 4 s.
robot: ${SIM2SIM_ROOT}/robots/microduck.json
num_envs: 16
episode_s: 8
headless: true
seed: 0
device: cpu
recv_timeout_s: 10.0
spawn_stagger_s: 0.05
max_faults_per_step: 8
init_onnx: ${MICRODUCK_POLICIES}/alpha_ground_pick.onnx

reset:
  yaw_range: [-3.141592653589793, 3.141592653589793]
  joint_noise_rad: 0.04

obs_noise:
  enabled: true
  kind: uniform
  gyro: 0.03
  grav: 0.01
  q: 0.001
  qd: 0.25

commands:
  mode: pick_phase
  pick_period: 4.0

curriculum:
  action_rate_l2: [-0.2, -1.0, 0, 700]

pushes:
  enabled: true
  interval_s: [4.0, 8.0]
  xy_speed: 0.12

rewards:
  track_lin_vel: 0.5
  track_ang_vel: 0.5
  upright: 0.8
  air_time: 0.0
  pose_legs: 0.0
  foot_clearance: 0.0
  foot_swing_height: 0.0
  action_rate_l2: -0.2
  foot_slip: -0.05
  body_ang_vel: -0.05
  head_pose_tracking: 0.0
  head_pose_bias: 0.0
  dof_pos_limits: -1.0
  mouth_proximity: 4.0
  mouth_std: 0.08
  pick_return: 2.0
  approach_height: 3.0
  approach_z: 0.075
  approach_z_std: 0.04
  posture_pose_std: 0.15
  scale_by_dt: true

termination:
  fallen: true
  tilt_deg: 70.0
  min_z: 0.04

ppo:
  learning_rate: 3.0e-4
  schedule: adaptive
  desired_kl: 0.015
  entropy_coef: 0.001
  clip_param: 0.2
  gamma: 0.99
  lam: 0.95
  num_learning_epochs: 5
  num_mini_batches: 4
  init_std: 0.18
  critic_warmup_iters: 80
  unfreeze_learning_rate: 3.0e-5
  hidden_dims: [512, 256, 128]
  activation: elu
  obs_normalization: true
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  normalize_advantage_per_mini_batch: false
  optimizer: adam
  samples_per_iter: 2048
  save_interval: 50

train:
  samples_per_iter: 2048
  save_interval: 50
  max_iterations: 1000
  log_root: logs/pick_godot
  run_name: pick

export:
  onnx: ${MICRODUCK_POLICIES}/GroundPick_Godot.onnx
  name: pick_godot
  kind: one_shot
  slot: ground_pick
  use_stand_policy: false
  description: Godot/Jolt fine-tuned ground pick (sim2sim).
